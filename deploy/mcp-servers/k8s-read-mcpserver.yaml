# k8s-read 的 kagent MCPServer 注册（T1.2：8 个只读工具）。
# kagent 据 spec.deployment 部署该 MCP server 容器，并经 httpTransport 路由到其 /mcp 端点做工具发现。
# 镜像由本地构建 + kind load 注入（aegis/k8s-read:<版本>），imagePullPolicy: IfNotPresent。
# 传输类型 http（Streamable HTTP）；transportType/port/httpTransport.targetPort 三者必须一致。
# serviceAccountName 必须显式：只读 RBAC 见 deploy/mcp-servers/k8s-read-rbac.yaml。
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: k8s-read
  namespace: kagent
  labels: {app: k8s-read, aegis.dev/component: mcp-server}
spec:
  transportType: http
  deployment:
    image: aegis/k8s-read:0.2.0
    imagePullPolicy: IfNotPresent
    port: 8080
    serviceAccountName: k8s-read
  httpTransport:
    path: /mcp
    targetPort: 8080

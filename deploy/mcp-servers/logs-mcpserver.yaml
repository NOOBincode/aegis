# logs 的 kagent MCPServer 注册（T1.3：aggregate_logs）。
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: logs
  namespace: kagent
  labels: {app: logs, aegis.dev/component: mcp-server}
spec:
  transportType: http
  deployment:
    image: aegis/logs:0.1.0
    imagePullPolicy: IfNotPresent
    port: 8083
    serviceAccountName: logs
  httpTransport:
    path: /mcp
    targetPort: 8083

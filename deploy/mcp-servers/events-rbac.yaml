# events server 的只读 SA/RBAC（T1.3）：list events；不读 Secret、无写。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: events
  namespace: kagent
  labels: {app: events, aegis.dev/component: mcp-server}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegis-events-read
  labels: {app: events, aegis.dev/component: mcp-server}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegis-events-read
  labels: {app: events, aegis.dev/component: mcp-server}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: aegis-events-read}
subjects:
  - {kind: ServiceAccount, name: events, namespace: kagent}

# scan server 的 kagent MCPServer 注册（T1.13：scan_cluster 被 kagent 发现的登记清单）。
# 参照 k8s-read-mcpserver.yaml。kagent 据 spec.deployment 部署该 MCP server 容器，
# 并经 httpTransport 路由到其 /mcp 端点做工具发现。
# 镜像由本地静态编译 + kind load 注入（aegis/scan:<版本>），imagePullPolicy: IfNotPresent。
# serviceAccountName: scan 提供 R0 只读权限（见 scan-rbac.yaml，最小权限 I3）。
# 传输类型 http（Streamable HTTP）；transportType/port/httpTransport.targetPort 三者必须一致。
apiVersion: kagent.dev/v1alpha1
kind: MCPServer
metadata:
  name: scan
  namespace: kagent
  labels: {app: scan, aegis.dev/component: mcp-server}
spec:
  transportType: http
  deployment:
    image: aegis/scan:0.1.0
    imagePullPolicy: IfNotPresent
    port: 8081
    serviceAccountName: scan
  httpTransport:
    path: /mcp
    targetPort: 8081

# logs server 的只读 SA/RBAC（T1.3）：list pods + get pods/log；不读 Secret、无写。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logs
  namespace: kagent
  labels: {app: logs, aegis.dev/component: mcp-server}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aegis-logs-read
  labels: {app: logs, aegis.dev/component: mcp-server}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aegis-logs-read
  labels: {app: logs, aegis.dev/component: mcp-server}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: aegis-logs-read}
subjects:
  - {kind: ServiceAccount, name: logs, namespace: kagent}

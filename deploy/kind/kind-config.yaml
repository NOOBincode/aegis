# kind 集群配置 —— aegis 本地/CI 唯一集群（deploy/kind/README.md §4.1/§4.2/§4.3）。
# 拓扑：1 control-plane + 2 worker（内存紧张可减 1+1，但控制器干扰类场景 F11/F13 演练打折）。
# 端口映射：宿主端口 ↔ 集群 NodePort 服务（同一仓库只保留这一份映射表）。
# 镜像加速：containerd registry mirror 注入（CI 不假设代理可达，依赖镜像源本身可达性）。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: aegis

# 节点镜像版本由 scripts/env-up.sh 从 deploy/versions.env 注入（kindest/node），此处不写死。

containerdConfigPatches:
  # 集群内 containerd 镜像加速（deploy/kind/README.md §4.3）。
  # 本环境实测：docker.io / *.github.io 不可达，DaoCloud 公共镜像源全 registry 可用且快。
  # 每个 registry 先走镜像源、回退官方源；网络环境不同改这里即可（同一仓库只保留这一份映射）。
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
      endpoint = ["https://docker.m.daocloud.io", "https://registry-1.docker.io"]
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."ghcr.io"]
      endpoint = ["https://ghcr.m.daocloud.io", "https://ghcr.io"]
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."registry.k8s.io"]
      endpoint = ["https://k8s.m.daocloud.io", "https://registry.k8s.io"]
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."gcr.io"]
      endpoint = ["https://gcr.m.daocloud.io", "https://gcr.io"]
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."quay.io"]
      endpoint = ["https://quay.m.daocloud.io", "https://quay.io"]

nodes:
  - role: control-plane
    extraPortMappings:
      # kube-apiserver 的 6443 由 kind 自动映射，无需在此声明。
      - containerPort: 30090   # Prometheus（指标调试）
        hostPort: 30090
      - containerPort: 30300   # Grafana（闸门核心看板）
        hostPort: 30300
      - containerPort: 30443   # ArgoCD（R2 GitOps 通道演示，T2.10）
        hostPort: 30443
      - containerPort: 30880   # kagent UI（Agent 声明与调试入口，T0.4）
        hostPort: 30880
  - role: worker
  - role: worker

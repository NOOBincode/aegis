# kagent 内自研 MCP server（scan/k8s-read/prom/logs/events）的入站白名单。
# 设计文档 R17：工具 server 只接受来自 kagent 命名空间内 Agent/controller 的连接，
# 拒绝其他命名空间（含 default）的直接调用，避免任意 Pod 借工具 SA 读集群（confused deputy）。
#
# 强制力实测（2026-10-18，本 kind kindnetd v20241108）：
#   - default namespace 的 curl Pod → scan:8081 超时（被阻断）；
#   - kagent namespace 的 curl Pod → scan:8081 HTTP 200（放行）；
#   - 删除本 NetworkPolicy 后 default Pod 立即恢复 200。故本环境 NetworkPolicy 确实生效。
# 注意：强制力仍取决于 CNI；换 Calico/Cilium/其他 CNI 后需用 scripts/security-smoke.sh 复测，
# 不在文档里做"所有环境都强制"的过度声明。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegis-mcp-ingress-kagent-only
  namespace: kagent
  labels: {aegis.dev/component: mcp-server}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["scan", "k8s-read", "prom", "logs", "events", "gatekeeper"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagent

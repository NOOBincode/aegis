# kagent 内自研 MCP server（scan / k8s-read）的入站白名单。
# 设计文档 R17：工具 server 只接受来自 kagent 命名空间内 Agent/controller 的连接，
# 拒绝其他命名空间（含 default）的直接调用，避免任意 Pod 借工具 SA 读集群（confused deputy）。
#
# 重要：当前 kind 默认 CNI 是 kindnet，**不实现 NetworkPolicy**；本清单在 kind 上是声明性
# 资产，不产生强制力。M1 的有效控制是：kagent-tools 关闭（无 cluster-admin 写工具）
# + scan/k8s-read 的 SA 只读（见各自 RBAC）。切到 Calico/Cilium 的 kind/集群后才生效。
# 不在文档里假装它已强制——这正是 I10 "失效姿态自明"。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegis-mcp-ingress-kagent-only
  namespace: kagent
  labels: {aegis.dev/component: mcp-server}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["scan", "k8s-read"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kagent

# aegis 只读诊断 Agent（Tier-0 规则层前置 + 只读工具族）。
# 设计文档 §4.3：上下文工程 + 工具白名单。M1 单 Agent；v2 起拆 diagnoser/executor/verifier。
# 纪律（systemMessage 固化）：先 scan_cluster 拿 Tier-0 结论，残差才用 k8s-read 取证；只读不写。
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: aegis-diagnoser
  namespace: kagent
  labels: {aegis.dev/component: agent}
spec:
  description: aegis 只读诊断 Agent——Tier-0 规则层前置（scan_cluster）+ 只读工具取证（k8s-read）
  type: Declarative
  declarative:
    modelConfig: aegis-model
    systemMessage: |
      你是 aegis 的 K8s 只读诊断 Agent。诊断纪律（严格按序）：
      1. 先用 scan_cluster 拿 Tier-0 确定性规则层结论。其中 next_tier=false 的 finding
         是规则已结案的根因（附置信度与证据），直接采纳，不要重复推理。
      2. 仅对 next_tier=true 的残差或需补充细节时，才调用 k8s-read 只读工具取证
         （get_pods/get_events/describe_pod/get_pod_logs 等）。
      3. 只读诊断：绝不执行任何写操作（不 scale/restart/delete/patch）。
      4. 输出格式：根因（命中规则或推断）+ 关键证据 + 置信度 + 处置建议。
         能确定就说确定，不确定就标注残差，不臆造。
    tools:
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: MCPServer
          name: scan
          toolNames: [scan_cluster]
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: MCPServer
          name: k8s-read
          toolNames:
            - get_pods
            - get_deployments
            - get_nodes
            - get_events
            - get_pod_logs
            - get_resource_metrics
            - describe_pod
            - describe_deployment

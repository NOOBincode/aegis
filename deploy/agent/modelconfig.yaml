# aegis 诊断 Agent 的 LLM 通道（ModelConfig）—— win-proxy OpenAI 兼容网关。
# 双通道设计（设计文档 §3.3）：公网 API 与私域/本地 LLM 同一 openAI 兼容抽象。
# 本清单走 win-proxy（172.25.16.1:15721，WSL2 宿主网关，kind pod 可达，免认证）。
# local LLM 接入：换 baseUrl 指向本地 vLLM/Ollama 的 OpenAI 兼容端点即可（契约不变）。

# win-proxy 免认证，但 kagent ModelConfig 要求 apiKeySecret 引用，给占位值。
apiVersion: v1
kind: Secret
metadata:
  name: aegis-llm
  namespace: kagent
  labels: {aegis.dev/component: agent}
stringData:
  KEY: "win-proxy-no-auth-required"
---
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: aegis-model
  namespace: kagent
  labels: {aegis.dev/component: agent}
spec:
  provider: OpenAI
  model: agnes-2.0-flash
  openAI:
    baseUrl: http://172.25.16.1:15721/v1
  apiKeySecret: aegis-llm
  apiKeySecretKey: KEY

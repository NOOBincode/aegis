# ChangeRequest CRD（设计文档 §5.1，M2 T2.1）。
# M2 过渡：先落 manifest；controller-gen 生成链与 CI diff 门禁在 T2.1-followup 补齐。
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: changerequests.aegis.dev
  labels: {aegis.dev/component: crd}
spec:
  group: aegis.dev
  names:
    kind: ChangeRequest
    listKind: ChangeRequestList
    plural: changerequests
    singular: changerequest
    shortNames: [cr]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: State, type: string, jsonPath: ".status.state"}
        - {name: Risk, type: string, jsonPath: ".spec.operations[0].riskLevel"}
        - {name: Age, type: date, jsonPath: ".metadata.creationTimestamp"}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion: {type: string}
            kind: {type: string}
            metadata: {type: object}
            spec:
              type: object
              required: [sessionRef, idempotencyKey, intent, source, operations]
              properties:
                sessionRef: {type: string}
                requestedBy: {type: string}
                clusterRef: {type: string}
                idempotencyKey: {type: string, minLength: 1, maxLength: 128}
                intent: {type: string, maxLength: 2048}
                source: {type: string, enum: [agent, human]}
                guardrailPolicyRef: {type: string}
                approval:
                  type: object
                  properties:
                    required: {type: boolean}
                    state: {type: string, enum: [Pending, Approved, Denied, ""]}
                    approver: {type: string}
                    decidedAt: {type: string}
                    channel: {type: string, enum: [cli, webhook, ""]}
                operations:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [tool, riskLevel]
                    properties:
                      tool: {type: string, minLength: 1}
                      args:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      riskLevel: {type: string, enum: [R0, R1, R2, R3]}
                      authorityCheck:
                        type: object
                        properties:
                          fieldOwner: {type: string}
                          decision: {type: string, enum: [clear, via-owner-api, rejected, ""]}
                      estBlastRadius:
                        type: object
                        properties:
                          pods: {type: integer, minimum: 0}
                          nodes: {type: integer, minimum: 0}
                          namespaces: {type: integer, minimum: 0}
                      dryRunResult: {type: string, enum: [passed, failed, skipped, ""]}
                      inverseOperation:
                        type: object
                        properties:
                          tool: {type: string}
                          args: {type: object, x-kubernetes-preserve-unknown-fields: true}
                          riskLevel: {type: string, enum: [R0, R1, R2, R3, ""]}
                          authorityCheck:
                            type: object
                            properties:
                              fieldOwner: {type: string}
                              decision: {type: string}
                          estBlastRadius:
                            type: object
                            properties:
                              pods: {type: integer, minimum: 0}
                              nodes: {type: integer, minimum: 0}
                              namespaces: {type: integer, minimum: 0}
                          dryRunResult: {type: string}
                          inverseVerified: {type: boolean}
                          timeout: {type: string}
                      inverseVerified: {type: boolean}
                      timeout: {type: string}
            status:
              type: object
              properties:
                state:
                  type: string
                  enum: [Pending, DryRunning, AwaitingApproval, Executing, Verifying, Committed, RolledBack, PartiallyRolledBack, Aborted, Rejected]
                approval:
                  type: object
                  properties:
                    required: {type: boolean}
                    state: {type: string, enum: [Pending, Approved, Denied, ""]}
                    approver: {type: string}
                    decidedAt: {type: string}
                    channel: {type: string, enum: [cli, webhook, ""]}
                abort:
                  type: object
                  properties:
                    requested: {type: boolean}
                    reason: {type: string}
                executedOps: {type: integer, minimum: 0}
                verification:
                  type: object
                  properties:
                    checks:
                      type: array
                      items:
                        type: object
                        properties:
                          name: {type: string}
                          passed: {type: boolean}
                    healthy: {type: boolean}
                rollback:
                  type: object
                  properties:
                    deadline: {type: string}
                    attempted: {type: boolean}
                    result: {type: string}
                auditRef: {type: string}
                observedGeneration: {type: integer}
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true

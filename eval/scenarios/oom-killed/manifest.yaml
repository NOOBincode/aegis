# M1 场景库第 1 号：容器内存超限 OOMKilled（不依赖 LLM 的确定性可复现故障）。
# 用 busybox awk 分配大数组触发 cgroup OOM（kind 无 stress 镜像依赖，复用已有 busybox）。
# apply：kubectl apply -f eval/scenarios/oom-killed/manifest.yaml
# 观察：kubectl -n aegis-eval get pods -w
# 清理：kubectl delete ns aegis-eval
apiVersion: v1
kind: Namespace
metadata:
  name: aegis-eval
  labels: {aegis.dev/component: eval}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oom-demo
  namespace: aegis-eval
  labels: {app: oom-demo, aegis.dev/component: eval}
spec:
  replicas: 1
  selector:
    matchLabels: {app: oom-demo}
  template:
    metadata:
      labels: {app: oom-demo}
    spec:
      containers:
        - name: oom
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          # 直接让 awk 作为容器 PID 1（不经 sh 子进程）；这样 cgroup OOM killer 杀的是
          # 容器主进程，kubelet 才会把 lastState.terminated.reason 标为 OOMKilled。
          # 若用 `sh -c awk`，OOM killer 可能只杀 awk 子进程，sh 以 137 退出，kubelet 记为
          # Error（这不是 OOMKilled 的合法样例，会导致 Tier-0 的 137 推断假阳性）。
          command:
            - awk
            - |
              BEGIN{for(i=0;i<2000000;i++) a[i]=sprintf("%01024d", i); while(1){}}
          resources:
            requests: {memory: 32Mi, cpu: 10m}
            limits: {memory: 128Mi, cpu: 200m}
